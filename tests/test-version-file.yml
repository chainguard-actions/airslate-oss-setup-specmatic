name: Test specmatic setup with version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Java (required by specmatic)
        run: |
          which java || (apt-get update -qq && apt-get install -y -qq default-jre-headless)
      - name: Create version file
        run: |
          echo "1.0.0" > "$GITHUB_WORKSPACE/.specmatic-version"
      - id: setup
        uses: .
        with:
          specmatic-version-file: '.specmatic-version'
        continue-on-error: true
      - name: Assert action ran (version installed or failed gracefully)
        env:
          ACTUAL: ${{ steps.setup.outputs.specmatic-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but specmatic-version output is empty"
              exit 1
            fi
            if ! echo "$ACTUAL" | grep -qE '[0-9]+\.[0-9]+'; then
              echo "FAIL: output does not look like a version: '$ACTUAL'"
              exit 1
            fi
            echo "PASS: specmatic-version output is '$ACTUAL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Java or network issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
